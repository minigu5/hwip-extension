<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
*{box-sizing:border-box;margin:0;padding:0}html,body{width:440px;height:280px;overflow:hidden}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;color:#fff;position:relative;-webkit-font-smoothing:antialiased;
 background:radial-gradient(360px 280px at 100% 0%,rgba(120,170,255,.6) 0%,rgba(120,170,255,0) 70%),linear-gradient(120deg,#2A63F0 0%,#2150D8 60%,#1A40B8 100%)}
.logo{position:absolute;left:32px;top:30px;display:flex;align-items:center;gap:12px;font-size:28px;font-weight:800}
.logo img{width:52px;height:52px;filter:drop-shadow(0 6px 14px rgba(8,30,110,.35))}
h1{position:absolute;left:32px;top:104px;font-size:36px;line-height:1.2;font-weight:800;letter-spacing:-1.2px;word-break:keep-all}
h1 em{font-style:normal;color:#BFD6FF}
.row{position:absolute;left:32px;right:32px;bottom:30px;display:flex;align-items:center;gap:10px}
.row span{background:#fff;color:#0F1B3D;border-radius:10px;padding:9px 13px;font-family:'SF Mono',Menlo,monospace;font-size:17px;font-weight:600;white-space:nowrap}
.row span.out{background:#0F1B3D;color:#E6EDFF;border:1px solid rgba(255,255,255,.18)}
.row span.out b{color:#7FB0FF}
.row i{font-style:normal;font-weight:800;font-size:20px}
</style></head><body>
<div class="logo"><img src="icon.svg">휩</div>
<h1>AI 수식을<br><em>한글(HWP)</em> 수식으로</h1>
<div class="row"><span>\frac{a}{b}</span><i>→</i><span class="out">{a} <b>over</b> {b}</span></div>
</body></html>
