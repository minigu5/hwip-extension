name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-companion:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows companion
        shell: powershell
        run: .\companion\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-companion
          path: |
            companion/windows/dist/HwipCompanion.exe
            companion/windows/dist/HwipCompanion.sha256

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Chrome extension
        run: |
          zip -r hwip-extension.zip \
            manifest.json background.js LICENSE README.md \
            _locales content convert icons lib popup sidepanel store templates
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: hwip-extension.zip

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-companion, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach files to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes
