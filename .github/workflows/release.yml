name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'ext-v*'

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Chrome extension
        run: |
          zip -r hwip-extension.zip \
            manifest.json background.js LICENSE README.md \
            _locales content convert icons lib popup sidepanel templates
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: hwip-extension.zip
      - name: Attach extension to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" hwip-extension.zip --generate-notes

