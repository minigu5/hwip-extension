name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'ext-v*'
      - 'companion-v*'

permissions:
  contents: write

jobs:
  extension:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ext-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Chrome extension
        run: |
          zip -r hwip-extension.zip \
            manifest.json background.js LICENSE README.md \
            _locales content convert icons lib popup sidepanel templates
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: hwip-extension.zip
      # 확장 릴리스는 Latest로 표시하지 않는다. releases/latest/download/HwipCompanion.exe 링크가
      # 항상 최신 보조 프로그램을 가리키게 하기 위해서다.
      - name: Attach extension to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" hwip-extension.zip --generate-notes --latest=false

  windows-companion:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/companion-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows companion
        shell: powershell
        run: .\companion\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-companion
          path: |
            companion/windows/dist/HwipCompanion.exe
            companion/windows/dist/HwipCompanion.sha256
      - name: Attach companion to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${env:GITHUB_REF_NAME}" companion/windows/dist/HwipCompanion.exe companion/windows/dist/HwipCompanion.sha256 --generate-notes --latest
